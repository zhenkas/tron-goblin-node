[package]
name = "tron-node"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Full-node daemon: opens RocksDB stores, runs the JSON-RPC server, syncs blocks from a peer, executes them into state."

[features]
block-memory-bench = ["tron-executor/bench-profile"]
block-tides-bench = ["block-memory-bench", "dep:tidesdb", "dep:rocksdb"]
devnet-fast = ["tron-tvm/devnet-fast", "tron-actuator/devnet-fast"]
private-network = ["tron-tvm/private-network"]

[dependencies]
critical-notify = { path = "../critical-notify" }
rocksdb = { workspace = true, optional = true }
tidesdb = { git = "https://github.com/tidesdb/tidesdb-rs", rev = "0b4eca75a3f96799a8cd0c63fd12e62662ffbaa4", optional = true, default-features = false }
tron-crypto = { path = "../tron-crypto" }
tron-proto = { path = "../tron-proto" }
tron-types = { path = "../tron-types" }
tron-chainbase = { path = "../tron-chainbase" }
tron-actuator = { path = "../tron-actuator" }
tron-executor = { path = "../tron-executor" }
tron-consensus = { path = "../tron-consensus" }
tron-rpc = { path = "../tron-rpc" }
tron-grpc = { path = "../tron-grpc" }
tron-mempool = { path = "../tron-mempool" }
tron-eventer = { path = "../tron-eventer" }
tron-eventer-kafka = { path = "../tron-eventer-kafka" }
tron-index = { path = "../tron-index" }
tron-sim = { path = "../tron-sim" }
tron-net = { path = "../tron-net" }
tron-tvm = { path = "../tron-tvm" }
tron-replay = { path = "../tron-replay" }
tron-wallet = { path = "../tron-wallet" }
tokio = { workspace = true, features = ["signal"] }
mimalloc = "0.1"
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
prost.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
tonic = { workspace = true, features = ["tls"] }
tokio-stream = "0.1"
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tar.workspace = true
flate2.workspace = true
rand = "0.8"
libc = "0.2"

[dev-dependencies]
hex-literal.workspace = true
prost-types.workspace = true
tempfile = "3"
# Serializes the snapshot import/export tests. Each test opens ~30
# RocksDB stores (~10 FDs per store during init), so 10 parallel tests
# burst past the default RLIMIT_NOFILE on most Linux systems and fail
# with "Too many open files".
serial_test = "3"

[[bin]]
name = "tron-node"
path = "src/main.rs"

[[example]]
name = "block_memory_bench"
path = "examples/block_memory_bench.rs"
required-features = ["block-memory-bench"]

[[example]]
name = "tides_read_probe"
path = "examples/tides_read_probe.rs"
required-features = ["block-tides-bench"]
