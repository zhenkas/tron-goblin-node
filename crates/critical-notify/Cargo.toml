[package]
name = "critical-notify"
version = "0.1.0"
edition = "2021"
description = "Durable critical-event notifications delivered to a local webhook"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"
